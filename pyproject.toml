[project]
name = "receipts"
version = "0.1.0"
description = "A styling agent that cites its evidence: a lead fans out researchers that check whether a declared fashion trend actually moved, and a writer turns their findings into an outfit with receipts"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pydantic>=2.6",
]

# Only the offline build needs these. Keeping them out of the deploy keeps the image small and
# means pytrends can never be imported by the server by accident.
[project.optional-dependencies]
build = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
]
